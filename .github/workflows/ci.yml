name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: checks
    runs-on: [self-hosted, Linux, ARM64, ai-incident-commander]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Runner requirement preflight
        shell: bash
        run: |
          missing=0

          for tool in bash findmnt git id node uname; do
            if command -v "$tool" >/dev/null 2>&1; then
              printf '%s: %s\n' "$tool" "$(command -v "$tool")"
            else
              printf '::error::%s is not installed on this runner\n' "$tool"
              missing=1
            fi
          done

          runner_os=$(uname -s)
          runner_arch=$(uname -m)
          if [[ "$runner_os" != Linux ]]; then
            printf '::error::runner OS is %s, expected Linux\n' "$runner_os"
            missing=1
          fi
          if [[ "$runner_arch" != aarch64 && "$runner_arch" != arm64 ]]; then
            printf '::error::runner architecture is %s, expected ARM64\n' "$runner_arch"
            missing=1
          fi

          runner_user=$(id -un)
          if [[ "$runner_user" != aic-runner ]]; then
            printf '::error::runner identity is %s, expected aic-runner\n' "$runner_user"
            missing=1
          fi
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            printf '::error::runner identity has passwordless sudo\n'
            missing=1
          fi

          if command -v findmnt >/dev/null 2>&1; then
            if ! mount_table=$(findmnt -rn -o FSTYPE,TARGET,SOURCE); then
              printf '::error::failed to inspect Lima host filesystem mounts\n'
              missing=1
            else
              host_mounts=
              while IFS= read -r mount_line; do
                fstype=${mount_line%% *}
                case "$fstype" in
                  virtiofs|9p|fuse.sshfs)
                    host_mounts+="${mount_line}"$'\n'
                    ;;
                esac
              done <<< "$mount_table"
              if [[ -n "$host_mounts" ]]; then
                printf '::error::Lima host filesystem mount detected: %s\n' "$host_mounts"
                missing=1
              fi
            fi
          fi
          exit "$missing"

      - name: Clean dependency install
        run: npm ci

      - name: Architecture boundary lint
        run: npm run lint

      - name: TypeScript build
        run: npm run build

      - name: Full test suite
        run: npm test
